version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: jwtdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: backend_jwt_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=clave_secreta_docker_prod_123
      - DB_HOST=postgres_db
      - DB_USER=postgres
      - DB_PASSWORD=secretpass
      - DB_NAME=jwtdb
      - DB_PORT=5432
    depends_on:
      - postgres_db

volumes:
  postgres_data:
